<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Personal Finance Planner</title>
<meta name="description" content="A private, local-first budgeting and financial-planning app. Track expenses, categorize spending, monitor investments, set goals, and get tailored advice from your financial profile. Your data stays in your browser.">
<!--
  Ledger — Personal Finance Planner
  ============================================================================
  A local-first, single-file web app. No build step and no dependencies are
  required: open this file in any browser or host it statically (e.g. GitHub
  Pages). See README.md for full documentation.

  PRIVACY / DATA
  --------------
  All of your financial data lives in your OWN browser (localStorage) and is
  never sent anywhere by default. Back it up with the encrypted JSON export in
  the Data tab.

  Optional end-to-end-encrypted cloud sync (for using the app across devices)
  is available but OFF until you configure it in Data > Cloud Sync. When
  enabled, your data is encrypted in-browser with a passphrase you choose
  (AES-GCM, key derived via PBKDF2) BEFORE it ever leaves the device — the sync
  server only ever stores an opaque ciphertext blob. See sync/README.md.

  Persistence layer: the Store module transparently uses the Claude Artifact
  storage API when present, otherwise localStorage, otherwise an in-memory
  session fallback.

  This file is organized top-to-bottom as: styles, markup shell, then a set of
  clearly delimited JS modules (Store, State, Selectors, Advice, Sync, UI).
-->
<style>
  :root{
    --paper:#ECE2CC;
    --paper-2:#E4D7B9;
    --card:#F6EFDE;
    --card-2:#F0E7D0;
    --ink:#2B2A28;
    --ink-soft:#615B4C;
    --ink-faint:#8A8069;
    --line:#D3C29A;
    --line-soft:#E0D2B0;
    --gold:#C1912E;
    --gold-deep:#8F6A18;
    --forest:#2F5D45;
    --forest-soft:#3C7757;
    --brick:#A44A32;
    --brick-soft:#C56A50;
    --sky:#3A6A86;
    --radius:14px;
    --radius-sm:9px;
    --shadow:0 1px 2px rgba(43,42,40,.05),0 6px 20px rgba(43,42,40,.06);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1100px 560px at 12% -8%, rgba(47,93,69,.06), transparent),
      radial-gradient(900px 500px at 100% 0%, rgba(193,145,46,.07), transparent),
      var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    min-height:100vh;
    line-height:1.5;
    padding-bottom:88px;
  }
  h1,h2,h3{font-family:'Fraunces','Georgia',serif;font-weight:600;letter-spacing:.2px;margin:0;}
  a{color:var(--gold-deep);}
  button{font-family:inherit;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 18px;}

  /* Header */
  header.top{
    position:sticky;top:0;z-index:40;
    background:linear-gradient(180deg, rgba(236,226,204,.96), rgba(236,226,204,.86));
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .top-inner{display:flex;align-items:center;gap:14px;padding:12px 18px;max-width:1080px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:11px;}
  .mark{
    width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
    background:linear-gradient(160deg,var(--forest),var(--forest-soft));
    color:#F6EFDE;font-family:'Fraunces',serif;font-weight:700;font-size:20px;
    box-shadow:var(--shadow);
  }
  .brand h1{font-size:20px;line-height:1;}
  .brand small{display:block;color:var(--ink-faint);font-size:11.5px;font-family:'IBM Plex Mono',monospace;letter-spacing:.3px;margin-top:3px;}
  .top-spacer{flex:1;}
  .sync-pill{
    font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);
    border:1px solid var(--line);background:var(--card);border-radius:999px;
    padding:5px 11px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-faint);}
  .dot.on{background:var(--forest-soft);}
  .dot.warn{background:var(--gold);}

  /* Tabs */
  nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 18px 0;max-width:1080px;margin:0 auto;}
  nav.tabs button{
    border:none;background:transparent;color:var(--ink-soft);
    padding:9px 14px 12px;font-size:14px;font-weight:600;cursor:pointer;
    border-bottom:2.5px solid transparent;white-space:nowrap;border-radius:8px 8px 0 0;
  }
  nav.tabs button:hover{color:var(--ink);background:rgba(255,255,255,.35);}
  nav.tabs button.active{color:var(--forest);border-bottom-color:var(--gold);}

  main{padding-top:20px;}
  section.tab{display:none;animation:fade .25s ease;}
  section.tab.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  /* Cards / layout */
  .grid{display:grid;gap:14px;}
  .cols-2{grid-template-columns:repeat(2,1fr);}
  .cols-3{grid-template-columns:repeat(3,1fr);}
  .cols-4{grid-template-columns:repeat(4,1fr);}
  @media(max-width:820px){.cols-3,.cols-4{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:520px){.cols-2,.cols-3,.cols-4{grid-template-columns:1fr;}}
  .card{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 17px;}
  .card h2{font-size:16px;margin-bottom:2px;}
  .card .sub{color:var(--ink-faint);font-size:12.5px;margin-bottom:12px;}
  .section-head{display:flex;align-items:baseline;gap:12px;margin:4px 2px 14px;}
  .section-head h2{font-size:22px;}
  .section-head p{color:var(--ink-soft);font-size:13.5px;margin:0;}

  /* Stat tiles */
  .stat{display:flex;flex-direction:column;gap:4px;}
  .stat .label{font-size:12px;color:var(--ink-faint);font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
  .stat .val{font-family:'Fraunces',serif;font-size:26px;font-weight:600;line-height:1.05;}
  .stat .hint{font-size:12px;color:var(--ink-soft);}
  .pos{color:var(--forest);}
  .neg{color:var(--brick);}
  .muted{color:var(--ink-faint);}

  /* Buttons / inputs */
  .btn{
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    padding:8px 14px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:600;
    cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.12s;
  }
  .btn:hover{background:var(--card-2);border-color:var(--line);}
  .btn.primary{background:linear-gradient(160deg,var(--forest),var(--forest-soft));color:#F6EFDE;border-color:transparent;}
  .btn.primary:hover{filter:brightness(1.06);}
  .btn.gold{background:linear-gradient(160deg,var(--gold),var(--gold-deep));color:#2B2415;border-color:transparent;}
  .btn.ghost{background:transparent;}
  .btn.danger{color:var(--brick);border-color:var(--brick-soft);}
  .btn.danger:hover{background:rgba(164,74,50,.08);}
  .btn.sm{padding:5px 10px;font-size:12.5px;}
  .btn.icon{padding:6px 8px;}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap;}

  label.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  input,select,textarea{
    font-family:inherit;font-size:14px;color:var(--ink);
    background:#FBF6E9;border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:9px 11px;width:100%;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid rgba(193,145,46,.35);outline-offset:1px;border-color:var(--gold);}
  textarea{resize:vertical;min-height:66px;}
  .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  @media(max-width:520px){.form-grid{grid-template-columns:1fr;}}

  /* Table */
  .tbl{width:100%;border-collapse:collapse;font-size:13.5px;}
  .tbl th{text-align:left;color:var(--ink-faint);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:8px 10px;border-bottom:1px solid var(--line);}
  .tbl td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  .tbl tr:last-child td{border-bottom:none;}
  .tbl .num{text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
  .tbl-scroll{overflow-x:auto;}

  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--card-2);border:1px solid var(--line-soft);}
  .chip .swatch{width:8px;height:8px;border-radius:50%;}
  .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.4px;}
  .badge.income{background:rgba(47,93,69,.13);color:var(--forest);}
  .badge.expense{background:rgba(164,74,50,.12);color:var(--brick);}

  /* Progress bars */
  .bar{height:9px;border-radius:99px;background:var(--paper-2);overflow:hidden;}
  .bar > span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--forest-soft),var(--forest));}
  .bar.over > span{background:linear-gradient(90deg,var(--brick-soft),var(--brick));}
  .bar.warn > span{background:linear-gradient(90deg,var(--gold),var(--gold-deep));}

  /* Advice cards */
  .advice{border-left:4px solid var(--line);background:var(--card);border-radius:0 var(--radius) var(--radius) 0;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow);}
  .advice.good{border-left-color:var(--forest-soft);}
  .advice.warn{border-left-color:var(--gold);}
  .advice.alert{border-left-color:var(--brick);}
  .advice h3{font-size:15px;margin-bottom:4px;display:flex;align-items:center;gap:8px;}
  .advice p{margin:0;font-size:13.5px;color:var(--ink-soft);}
  .advice .tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:5px;background:var(--card-2);color:var(--ink-faint);}

  /* Modal */
  .modal-back{position:fixed;inset:0;background:rgba(43,42,40,.42);backdrop-filter:blur(2px);display:none;place-items:center;z-index:80;padding:16px;}
  .modal-back.open{display:grid;}
  .modal{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.28);max-width:520px;width:100%;max-height:90vh;overflow:auto;}
  .modal header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);}
  .modal header h2{font-size:18px;}
  .modal .body{padding:18px;display:flex;flex-direction:column;gap:14px;}
  .modal footer{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--paper);}
  .x{border:none;background:transparent;font-size:22px;line-height:1;cursor:pointer;color:var(--ink-faint);}

  .empty{text-align:center;color:var(--ink-faint);padding:34px 16px;font-size:14px;}
  .empty .big{font-size:30px;margin-bottom:6px;}
  .hr{height:1px;background:var(--line-soft);margin:14px 0;}
  .kv{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:5px 0;}
  .kv .k{color:var(--ink-soft);}
  .kv .v{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
  .pill-group{display:flex;flex-wrap:wrap;gap:7px;}
  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--forest-deep,#22301F);color:#F6EFDE;padding:10px 18px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:.25s;z-index:100;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .note{font-size:12.5px;color:var(--ink-faint);background:var(--card-2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;}
  svg text{font-family:'IBM Plex Mono',monospace;}
  .foot{color:var(--ink-faint);font-size:12px;text-align:center;padding:26px 0 8px;}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="mark">₺</div>
      <div><h1>Ledger</h1><small id="brandSub">Personal Finance Planner</small></div>
    </div>
    <div class="top-spacer"></div>
    <span class="sync-pill" id="syncPill" title="Where your data lives">
      <span class="dot" id="syncDot"></span><span id="syncText">Local · this device</span>
    </span>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="dashboard" class="active">Dashboard</button>
    <button data-tab="budget">Budget</button>
    <button data-tab="transactions">Transactions</button>
    <button data-tab="investments">Investments</button>
    <button data-tab="goals">Goals</button>
    <button data-tab="profile">Profile</button>
    <button data-tab="advice">Advice</button>
    <button data-tab="data">Data</button>
  </nav>
</header>

<main class="wrap">
  <section class="tab active" id="tab-dashboard"></section>
  <section class="tab" id="tab-budget"></section>
  <section class="tab" id="tab-transactions"></section>
  <section class="tab" id="tab-investments"></section>
  <section class="tab" id="tab-goals"></section>
  <section class="tab" id="tab-profile"></section>
  <section class="tab" id="tab-advice"></section>
  <section class="tab" id="tab-data"></section>
  <p class="foot">Ledger · local-first personal finance · your data stays in your browser</p>
</main>

<div class="modal-back" id="modalBack">
  <div class="modal" id="modal">
    <header><h2 id="modalTitle">—</h2><button class="x" id="modalX">&times;</button></header>
    <div class="body" id="modalBody"></div>
    <footer id="modalFoot"></footer>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ==========================================================================
   0. Small utilities
   ========================================================================== */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clamp = (n,a,b)=>Math.max(a,Math.min(b,n));
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO = ()=> new Date().toISOString().slice(0,10);
const monthKey = d => (d||todayISO()).slice(0,7);              // "YYYY-MM"
const nowMonth = ()=> monthKey(todayISO());
function addMonths(mk, n){ const [y,m]=mk.split('-').map(Number); const d=new Date(y,m-1+n,1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function monthLabel(mk){ const [y,m]=mk.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString(undefined,{month:'short',year:'2-digit'}); }
function daysInMonth(mk){ const [y,m]=mk.split('-').map(Number); return new Date(y,m,0).getDate(); }

/* ==========================================================================
   1. Store  — Artifact storage API → localStorage → in-memory
   ========================================================================== */
const Store = (()=>{
  const KEY='ledger.finance.v1';
  const hasArtifact = typeof window!=='undefined' && window.claude && window.claude.storage;
  let mem=null;
  return {
    mode: hasArtifact?'artifact':(()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return 'local';}catch(e){return 'memory';}})(),
    async load(){
      try{
        if(this.mode==='artifact'){ const v=await window.claude.storage.getItem(KEY); return v?JSON.parse(v):null; }
        if(this.mode==='local'){ const v=localStorage.getItem(KEY); return v?JSON.parse(v):null; }
        return mem;
      }catch(e){ console.warn('load failed',e); return null; }
    },
    async save(obj){
      const s=JSON.stringify(obj);
      try{
        if(this.mode==='artifact'){ await window.claude.storage.setItem(KEY,s); }
        else if(this.mode==='local'){ localStorage.setItem(KEY,s); }
        else { mem=obj; }
      }catch(e){ console.warn('save failed',e); mem=obj; }
    }
  };
})();

/* ==========================================================================
   2. State  — model + defaults + persistence + currency formatting
   ========================================================================== */
const DEFAULT_CATEGORIES = [
  ['Housing','Essentials',1400,'#2F5D45'],['Groceries','Essentials',450,'#3C7757'],
  ['Utilities','Essentials',180,'#4E7C63'],['Transport','Essentials',220,'#5E866F'],
  ['Insurance','Essentials',160,'#6C8C77'],['Health','Essentials',120,'#7A9382'],
  ['Dining Out','Lifestyle',200,'#C1912E'],['Entertainment','Lifestyle',120,'#CBA24A'],
  ['Shopping','Lifestyle',150,'#D3B063'],['Subscriptions','Lifestyle',60,'#A44A32'],
  ['Travel','Lifestyle',150,'#C56A50'],['Misc','Lifestyle',80,'#8A8069'],
];
function seed(){
  const cats = DEFAULT_CATEGORIES.map(([name,group,budget,color])=>({id:uid(),name,group,budget,color}));
  return {
    version:1,
    profile:{ name:'', monthlyIncome:0, age:30, dependents:0, riskTolerance:'moderate',
              emergencyMonths:6, savingsRateGoal:20, debtTotal:0, debtApr:0, debtMonthly:0 },
    settings:{ currency:'USD', locale:navigator.language||'en-US' },
    accounts:[
      {id:uid(),name:'Checking',type:'checking',balance:0},
      {id:uid(),name:'Savings',type:'savings',balance:0},
    ],
    categories:cats,
    txns:[],
    investments:[],
    goals:[],
    sync:{ enabled:false, provider:'supabase', url:'', anonKey:'', table:'ledger_vault', vaultId:'', lastSyncedAt:null },
    meta:{ createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() }
  };
}
let S = seed();
let SAVE_T=null;
function persist(){
  S.meta.updatedAt=new Date().toISOString();
  clearTimeout(SAVE_T);
  SAVE_T=setTimeout(()=>Store.save(S), 180);
}
function fmtMoney(n, opts={}){
  const cur=S.settings.currency||'USD';
  try{ return new Intl.NumberFormat(S.settings.locale||'en-US',{style:'currency',currency:cur,maximumFractionDigits:opts.cents===false?0:2}).format(n||0); }
  catch(e){ return (cur+' ')+Number(n||0).toFixed(2); }
}
const money0 = n => fmtMoney(n,{cents:false});
const pct = (n,d=0)=> (isFinite(n)?n:0).toFixed(d)+'%';

/* ==========================================================================
   3. Selectors — derived figures used across the app & the advice engine
   ========================================================================== */
const Sel = {
  category:id=>S.categories.find(c=>c.id===id),
  account:id=>S.accounts.find(a=>a.id===id),
  isLiability:a=>a.type==='credit'||a.type==='loan',
  liquid(){ return S.accounts.filter(a=>['checking','savings','cash'].includes(a.type)).reduce((s,a)=>s+ +a.balance,0); },
  investmentsValue(){ return S.investments.reduce((s,i)=>s + (+i.quantity)*(+i.price),0); },
  investmentsCost(){ return S.investments.reduce((s,i)=>s + (+i.quantity)*(+i.costBasis),0); },
  accountAssets(){ return S.accounts.filter(a=>!Sel.isLiability(a)).reduce((s,a)=>s+ +a.balance,0); },
  accountLiabilities(){ return S.accounts.filter(a=>Sel.isLiability(a)).reduce((s,a)=>s+ +a.balance,0); },
  assets(){ return Sel.accountAssets()+Sel.investmentsValue(); },
  liabilities(){ return Sel.accountLiabilities()+ (+S.profile.debtTotal||0); },
  netWorth(){ return Sel.assets()-Sel.liabilities(); },
  txnsIn(mk){ return S.txns.filter(t=>monthKey(t.date)===mk); },
  spentInMonth(mk){ return Sel.txnsIn(mk).filter(t=>t.type==='expense').reduce((s,t)=>s+ +t.amount,0); },
  incomeInMonth(mk){ const ti=Sel.txnsIn(mk).filter(t=>t.type==='income').reduce((s,t)=>s+ +t.amount,0); return ti|| +S.profile.monthlyIncome||0; },
  spentByCategory(mk){ const m={}; Sel.txnsIn(mk).filter(t=>t.type==='expense').forEach(t=>{ m[t.categoryId]=(m[t.categoryId]||0)+ +t.amount; }); return m; },
  budgetTotal(){ return S.categories.reduce((s,c)=>s+ +c.budget,0); },
  recentMonths(n){ const out=[]; let mk=nowMonth(); for(let i=0;i<n;i++){ out.unshift(mk); mk=addMonths(mk,-1);} return out; },
  avgMonthlySpend(n=3){
    const months=Sel.recentMonths(n).filter(mk=>Sel.txnsIn(mk).length>0);
    if(!months.length) return Sel.budgetTotal();
    return months.reduce((s,mk)=>s+Sel.spentInMonth(mk),0)/months.length;
  },
  savingsRate(mk){ const inc=Sel.incomeInMonth(mk); if(!inc) return 0; return clamp((inc-Sel.spentInMonth(mk))/inc*100,-999,100); },
  emergencyCoverage(){ const spend=Sel.avgMonthlySpend()|| +S.profile.monthlyIncome*0.7||1; return spend>0? Sel.liquid()/spend : 0; },
  allocation(){ const m={}; let tot=0; S.investments.forEach(i=>{ const v=(+i.quantity)*(+i.price); m[i.assetClass]=(m[i.assetClass]||0)+v; tot+=v;}); return {byClass:m,total:tot}; },
};

/* ==========================================================================
   4. Advice engine — rule-based, reads profile + goals + live data
   ========================================================================== */
function buildAdvice(){
  const A=[]; const p=S.profile;
  const push=(level,title,body,tag)=>A.push({level,title,body,tag});
  const hasData = S.txns.length>0 || p.monthlyIncome>0;

  if(!hasData){
    push('warn','Add your numbers to unlock guidance',
      'Set your monthly income in the Profile tab and log a few transactions. Ledger tailors every recommendation below to your own profile and goals.','Start here');
    return A;
  }

  // 1. Emergency fund
  const cov=Sel.emergencyCoverage(), target=+p.emergencyMonths||3, spend=Sel.avgMonthlySpend();
  if(cov < target){
    const gap=(target-cov)*spend;
    push(cov<Math.min(1,target)?'alert':'warn','Emergency fund below target',
      `You hold about ${cov.toFixed(1)} months of expenses in liquid cash; your target is ${target}. Aim to add roughly ${money0(gap)} to a savings account before investing more.`,'Safety net');
  } else {
    push('good','Emergency fund is healthy',
      `You have ~${cov.toFixed(1)} months of expenses set aside (target ${target}). Nicely done — this is the foundation everything else builds on.`,'Safety net');
  }

  // 2. Savings rate
  const sr=Sel.savingsRate(nowMonth()), goal=+p.savingsRateGoal||0;
  if(goal>0){
    if(sr>=goal) push('good','Meeting your savings-rate goal',`This month you're saving about ${pct(sr,0)} of income, at or above your ${pct(goal,0)} goal.`,'Savings rate');
    else if(sr>=0) push('warn','Below your savings-rate goal',`You're saving ~${pct(sr,0)} this month vs a ${pct(goal,0)} goal. Trimming your largest flexible category could close the gap.`,'Savings rate');
    else push('alert','Spending more than you earn this month',`Expenses exceed income (savings rate ${pct(sr,0)}). Review the Budget tab for categories running over.`,'Cash flow');
  }

  // 3. Over-budget categories (current month)
  const spentBy=Sel.spentByCategory(nowMonth());
  const over=S.categories.filter(c=>c.budget>0 && (spentBy[c.id]||0) > c.budget)
    .map(c=>({c,spent:spentBy[c.id]||0})).sort((a,b)=>(b.spent-b.c.budget)-(a.spent-a.c.budget));
  if(over.length){
    const top=over.slice(0,3).map(o=>`${o.c.name} (${money0(o.spent)} / ${money0(o.c.budget)})`).join(', ');
    push('warn',`${over.length} categor${over.length>1?'ies are':'y is'} over budget`,`Running over this month: ${top}. Move money from an under-spent category, or adjust the plan.`,'Budget');
  }

  // 4. Spending concentration
  const monthSpend=Sel.spentInMonth(nowMonth());
  if(monthSpend>0){
    const arr=Object.entries(spentBy).map(([id,v])=>({c:Sel.category(id),v})).filter(x=>x.c).sort((a,b)=>b.v-a.v);
    if(arr[0] && arr[0].v/monthSpend>0.4)
      push('warn','Spending is concentrated',`${arr[0].c.name} is ${pct(arr[0].v/monthSpend*100,0)} of this month's spending. A single dominant category is worth a closer look.`,'Diversify');
  }

  // 5. High-interest debt
  if((+p.debtTotal||0)>0 && (+p.debtApr||0)>=7){
    push('alert','Prioritise your high-interest debt',`You carry ${money0(p.debtTotal)} at ${pct(p.debtApr,1)} APR. Paying this down is a guaranteed ${pct(p.debtApr,1)} return — usually better than investing until it's cleared.`,'Debt');
  } else if((+p.debtTotal||0)>0){
    push('warn','Low-interest debt on the books',`${money0(p.debtTotal)} at ${pct(p.debtApr,1)} APR. Low rates can be paid on schedule while you invest — keep an eye on the balance.`,'Debt');
  }

  // 6. Investment allocation vs risk tolerance / age
  const alloc=Sel.allocation();
  if(alloc.total>0){
    const stock=((alloc.byClass.stock||0)+(alloc.byClass.crypto||0))/alloc.total*100;
    const glide=clamp(110-(+p.age||30),20,95);
    const riskTarget={conservative:clamp(glide-20,10,80),moderate:glide,aggressive:clamp(glide+12,30,100)}[p.riskTolerance]||glide;
    if(stock > riskTarget+15) push('warn','Portfolio is stock-heavy for your profile',`~${pct(stock,0)} of investments are in stocks/crypto; a ${p.riskTolerance} profile at age ${p.age} suggests closer to ${pct(riskTarget,0)}. Consider rebalancing toward bonds/cash.`,'Allocation');
    else if(stock < riskTarget-15) push('warn','Portfolio may be too conservative',`Only ~${pct(stock,0)} in growth assets vs a suggested ~${pct(riskTarget,0)} for a ${p.riskTolerance} profile at age ${p.age}. You may be leaving long-term growth on the table.`,'Allocation');
    else push('good','Investment mix fits your profile',`~${pct(stock,0)} in growth assets is in line with a ${p.riskTolerance} profile at age ${p.age} (guide ~${pct(riskTarget,0)}).`,'Allocation');
    const gain=Sel.investmentsValue()-Sel.investmentsCost();
    if(Math.abs(gain)>0.005*(Sel.investmentsCost()||1)) push(gain>=0?'good':'warn',`Portfolio is ${gain>=0?'up':'down'} ${money0(Math.abs(gain))}`,`Current value ${money0(Sel.investmentsValue())} vs cost basis ${money0(Sel.investmentsCost())}.`,'Performance');
  }

  // 7. Idle cash beyond the emergency fund
  const idle=Sel.liquid()-target*spend;
  if(cov>=target && idle > Math.max(2000,spend)){
    push('warn','Cash is sitting idle',`You have about ${money0(idle)} in cash beyond your ${target}-month buffer. Putting the surplus to work (investing, or a high-yield account) protects it from inflation.`,'Optimise');
  }

  // 8. Goal pacing
  S.goals.forEach(g=>{
    const remaining=Math.max(0,(+g.target||0)-(+g.saved||0));
    if(remaining<=0){ push('good',`Goal reached: ${g.name}`,`You've funded ${money0(g.target)} — consider setting the next one.`,'Goal'); return; }
    if(g.targetDate){
      const months=Math.max(0,(new Date(g.targetDate)-new Date())/(1000*60*60*24*30.4));
      if(months<=0){ push('alert',`Goal past its date: ${g.name}`,`${money0(remaining)} still to go and the target date has passed. Reset the date or top it up.`,'Goal'); return; }
      const need=remaining/months;
      push(need>Sel.savingsRate(nowMonth())/100*Sel.incomeInMonth(nowMonth())?'warn':'good',`Goal pacing: ${g.name}`,`${money0(remaining)} to go in ~${Math.ceil(months)} months → about ${money0(need)}/month needed.`,'Goal');
    }
  });

  // 9. Positive close
  if(!A.some(a=>a.level==='alert') && sr>=goal && cov>=target)
    push('good','You are on a strong footing','Emergency fund funded, savings goal met, no high-interest debt flagged. Keep the plan steady and revisit allocations quarterly.','Momentum');

  const order={alert:0,warn:1,good:2};
  return A.sort((a,b)=>order[a.level]-order[b.level]);
}

/* ==========================================================================
   5. Sync — optional end-to-end encrypted vault (Supabase REST adapter)
      Data is encrypted in-browser (AES-GCM, PBKDF2) before upload.
      OFF until the user configures & enables it in the Data tab.
   ========================================================================== */
const Sync = (()=>{
  const enc=new TextEncoder(), dec=new TextDecoder();
  const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
  const unb64=str=>Uint8Array.from(atob(str),c=>c.charCodeAt(0));
  async function deriveKey(passphrase,salt){
    const base=await crypto.subtle.importKey('raw',enc.encode(passphrase),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  }
  async function encryptState(passphrase,obj){
    const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
    const key=await deriveKey(passphrase,salt);
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(obj)));
    return {v:1,salt:b64(salt),iv:b64(iv),ct:b64(ct)};
  }
  async function decryptState(passphrase,payload){
    const key=await deriveKey(passphrase,unb64(payload.salt));
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(payload.iv)},key,unb64(payload.ct));
    return JSON.parse(dec.decode(pt));
  }
  function headers(cfg){ return {'apikey':cfg.anonKey,'Authorization':`Bearer ${cfg.anonKey}`,'Content-Type':'application/json'}; }
  async function push(passphrase){
    const cfg=S.sync; if(!cfg.url||!cfg.anonKey||!cfg.vaultId) throw new Error('Sync is not fully configured.');
    const clone=JSON.parse(JSON.stringify(S)); clone.sync={enabled:false,provider:cfg.provider,url:'',anonKey:'',table:cfg.table,vaultId:'',lastSyncedAt:null};
    const blob=await encryptState(passphrase,clone);
    const row={vault_id:cfg.vaultId,payload:blob,updated_at:new Date().toISOString()};
    const r=await fetch(`${cfg.url.replace(/\/$/,'')}/rest/v1/${cfg.table}?on_conflict=vault_id`,
      {method:'POST',headers:{...headers(cfg),'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(row)});
    if(!r.ok) throw new Error('Upload failed ('+r.status+'). Check URL, key and table.');
    S.sync.lastSyncedAt=new Date().toISOString(); persist();
  }
  async function pull(passphrase){
    const cfg=S.sync; if(!cfg.url||!cfg.anonKey||!cfg.vaultId) throw new Error('Sync is not fully configured.');
    const r=await fetch(`${cfg.url.replace(/\/$/,'')}/rest/v1/${cfg.table}?vault_id=eq.${encodeURIComponent(cfg.vaultId)}&select=payload,updated_at`,{headers:headers(cfg)});
    if(!r.ok) throw new Error('Download failed ('+r.status+').');
    const rows=await r.json();
    if(!rows.length) throw new Error('No vault found for that Vault ID.');
    const remote=await decryptState(passphrase,rows[0].payload);
    const keepSync=S.sync;
    S=Object.assign(seed(),remote); S.sync=keepSync; S.sync.lastSyncedAt=new Date().toISOString();
    persist();
  }
  return {push,pull,encryptState,decryptState};
})();

function donut(alloc,colors,labels){
  const entries=Object.entries(alloc.byClass).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  let acc=0; const R=52,C=2*Math.PI*R;
  const segs=entries.map(([k,v])=>{ const frac=v/alloc.total; const dash=`${frac*C} ${C}`; const off=-acc*C; acc+=frac;
    return `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${colors[k]||'#8A8069'}" stroke-width="20" stroke-dasharray="${dash}" stroke-dashoffset="${off}" transform="rotate(-90 70 70)"></circle>`; }).join('');
  return `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
    <svg width="140" height="140" viewBox="0 0 140 140">${segs}<text x="70" y="66" text-anchor="middle" font-size="11" fill="#8A8069">Total</text><text x="70" y="82" text-anchor="middle" font-size="13" fill="#2B2A28" font-weight="600">${money0(alloc.total)}</text></svg>
    <div style="flex:1;min-width:140px">${entries.map(([k,v])=>`<div class="kv"><span class="k"><span class="swatch" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${colors[k]||'#8A8069'};margin-right:7px"></span>${labels[k]||k}</span><span class="v">${pct(v/alloc.total*100,0)}</span></div>`).join('')}</div>
  </div>`;
}

function saveSyncConfig(){
  S.sync.url=$('#sy_url').value.trim(); S.sync.anonKey=$('#sy_key').value.trim();
  S.sync.table=$('#sy_table').value.trim()||'ledger_vault'; S.sync.vaultId=$('#sy_vault').value.trim();
  S.sync.enabled=!!(S.sync.url&&S.sync.anonKey&&S.sync.vaultId);
  persist(); toast('Sync settings saved'); renderData(); renderSyncPill();
}
async function doSync(dir){
  const pass=$('#sy_pass').value; saveSyncConfig();
  if(!S.sync.url||!S.sync.anonKey||!S.sync.vaultId){ toast('Fill in URL, key and Vault ID first'); return; }
  if(!pass){ toast('Enter your encryption passphrase'); return; }
  try{
    toast(dir==='push'?'Encrypting & uploading…':'Downloading & decrypting…');
    if(dir==='push') await Sync.push(pass); else await Sync.pull(pass);
    toast(dir==='push'?'Pushed to cloud ✓':'Pulled from cloud ✓');
    renderData(); renderSyncPill();
  }catch(e){ console.error(e); toast('Sync error: '+e.message); }
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`ledger-backup-${todayISO()}.json`; a.click(); URL.revokeObjectURL(a.href); toast('Exported');
}
function importData(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const obj=JSON.parse(r.result); if(!obj.version||!obj.categories) throw new Error('Not a Ledger backup');
    S=Object.assign(seed(),obj); persist(); toast('Data imported'); renderAll(); switchTab('dashboard'); }
    catch(err){ toast('Import failed: '+err.message); } };
  r.readAsText(f); e.target.value='';
}

  openModal('Reset all data?','<p style="font-size:14px;color:var(--ink-soft)">This permanently deletes every account, transaction, investment, goal and profile setting in this browser. Export a backup first if you might want it back.</p>',

      <label class="field"><span>Name</span><input id="i_name" value="${esc(i.name)}" autofocus placeholder="e.g. S&amp;P 500 Index"></label>
      <label class="field"><span>Ticker (optional)</span><input id="i_ticker" value="${esc(i.ticker||'')}" placeholder="VOO"></label>
      <label class="field"><span>Asset class</span><select id="i_class">${classes.map(([v,l])=>`<option value="${v}" ${i.assetClass===v?'selected':''}>${l}</option>`).join('')}</select></label>
      <label class="field"><span>Quantity / units</span><input id="i_qty" type="number" min="0" step="any" value="${i.quantity}"></label>
      <label class="field"><span>Cost basis (per unit)</span><input id="i_cost" type="number" min="0" step="any" value="${i.costBasis}"></label>
      <label class="field"><span>Current price (per unit)</span><input id="i_price" type="number" min="0" step="any" value="${i.price}"></label>
    </div><div class="note">Enter prices per unit. For a single lump holding, set quantity to 1 and use total amounts. Update the current price periodically to keep value and P/L accurate.</div>`,
    `${id?`<button class="btn danger" onclick="delInvestment('${id}')">Delete</button>`:''}<span style="flex:1"></span>
     <button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveInvestment('${id}')">Save</button>`);
}
function saveInvestment(id){
  const name=$('#i_name').value.trim(); if(!name){ toast('Name required'); return; }
  const rec={id:id||uid(),name,ticker:$('#i_ticker').value.trim(),assetClass:$('#i_class').value,
    quantity:+$('#i_qty').value||0,costBasis:+$('#i_cost').value||0,price:+$('#i_price').value||0};
  if(id){ const i=S.investments.findIndex(x=>x.id===id); S.investments[i]=rec; } else S.investments.push(rec);
  persist(); closeModal(); toast('Saved'); renderInvestments();
}
function delInvestment(id){ S.investments=S.investments.filter(x=>x.id!==id); persist(); closeModal(); toast('Deleted'); renderInvestments(); }

function editGoal(id){
  const g=id?S.goals.find(x=>x.id===id):{id:'',name:'',target:'',saved:'',targetDate:''};
  openModal(id?'Edit goal':'New goal',`
    <div class="form-grid">
      <label class="field" style="grid-column:1/-1"><span>Goal name</span><input id="g_name" value="${esc(g.name)}" autofocus placeholder="e.g. House down payment"></label>
      <label class="field"><span>Target amount</span><input id="g_target" type="number" min="0" step="100" value="${g.target}"></label>
      <label class="field"><span>Saved so far</span><input id="g_saved" type="number" min="0" step="100" value="${g.saved}"></label>
      <label class="field" style="grid-column:1/-1"><span>Target date (optional)</span><input id="g_date" type="date" value="${g.targetDate||''}"></label>
    </div>`,
    `${id?`<button class="btn danger" onclick="delGoal('${id}')">Delete</button>`:''}<span style="flex:1"></span>
     <button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveGoal('${id}')">Save</button>`);
}
function saveGoal(id){
  const name=$('#g_name').value.trim(); if(!name){ toast('Name required'); return; }
  const rec={id:id||uid(),name,target:+$('#g_target').value||0,saved:+$('#g_saved').value||0,targetDate:$('#g_date').value||''};
  if(id){ const i=S.goals.findIndex(x=>x.id===id); S.goals[i]=rec; } else S.goals.push(rec);
  persist(); closeModal(); toast('Saved'); renderGoals();
}
function delGoal(id){ S.goals=S.goals.filter(x=>x.id!==id); persist(); closeModal(); toast('Deleted'); renderGoals(); }

/* expose handlers used from inline onclick */
Object.assign(window,{switchTab,editTxn,saveTxn,delTxn,editCategory,saveCategory,delCategory,
  editAccount,saveAccount,delAccount,editInvestment,saveInvestment,delInvestment,editGoal,saveGoal,delGoal,
  saveProfile,exportData,resetAll,confirmReset,closeModal,shiftBudgetMonth,quickAddTxn,
  saveSyncConfig,doSync});

/* ==========================================================================
   8. Boot
   ========================================================================== */
(async function boot(){
  const loaded=await Store.load();
  if(loaded && loaded.version){ S=Object.assign(seed(),loaded); }
  else { await Store.save(S); }
  document.fonts && document.fonts.ready;
  renderAll();
})();
</script>
</body>
</html>
